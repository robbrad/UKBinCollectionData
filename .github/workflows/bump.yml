name: Release - Bump Version

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "wiki/**"
      - "**/*.md"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: bump

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Commitizen
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-commitizen-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-commitizen-

      - name: Install Commitizen
        run: pip install commitizen

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and create tag
        id: bump
        run: |
          # Exit 3 (NO_COMMITS_FOUND) and 21 (NO_INCREMENT: commits exist but
          # none are fix/feat/etc.) both mean "nothing to release", not a failure.
          set +e
          cz bump --yes --changelog --dry-run
          rc=$?
          set -e
          if [ "$rc" -eq 3 ] || [ "$rc" -eq 21 ]; then
            echo "No version bump needed - no releasable conventional commits since last release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          cz bump --yes --changelog
          echo "version=$(cz version --project)" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        if: steps.bump.outputs.skip != 'true'
        run: |
          git push origin master
          git push origin --tags

      - name: Create workflow summary
        if: always()
        run: |
          echo "## Bump Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.bump.outputs.skip }}" == "true" ]; then
            echo "- **Status**: ⏭️ Skipped (no conventional commits)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **New Version**: ${{ steps.bump.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag Created**: ${{ steps.bump.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
