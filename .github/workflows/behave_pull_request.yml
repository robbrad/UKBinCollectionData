name: PR - Test Councils

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "wiki/**"
      - "**/*.md"
      - "uk_bin_collection_api_server/**"

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Configure Poetry to use the active interpreter
        run: poetry config virtualenvs.prefer-active-python true

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install Dependencies
        run: make install-dev

      - name: Lint JSON
        run: jq empty uk_bin_collection/tests/input.json

      - name: Get All Council Files That Have Changed
        id: changed-council-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            uk_bin_collection/uk_bin_collection/councils/**.py
      - name: Set Council Tests Environment Variable
        id: set-council-tests
        run: |
          IFS=' ' read -ra FILES <<< "${{ steps.changed-council-files.outputs.all_changed_files }}"
          COUNCIL_TESTS=""
          for file in "${FILES[@]}"; do
            FILENAME=$(basename "$file" .py)
            if [ -z "$COUNCIL_TESTS" ]; then
              COUNCIL_TESTS="$FILENAME"
            else
              COUNCIL_TESTS="$COUNCIL_TESTS or $FILENAME"
            fi
          done
          echo "council_tests=$COUNCIL_TESTS" >> $GITHUB_OUTPUT
    outputs:
      council_tests: ${{ steps.set-council-tests.outputs.council_tests }}

  unit-tests:
    name: Run Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
        poetry-version: [1.8.4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==${{ matrix.poetry-version }}

      - name: Configure Poetry to use the active interpreter
        run: poetry config virtualenvs.prefer-active-python true

      - name: Install Dependencies
        run: make install-dev

      - name: Run Unit Tests
        run: make unit-tests

      - name: Upload Test Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml

  parity-check:
    name: Parity Check
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
        poetry-version: [1.8.4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==${{ matrix.poetry-version }}

      - name: Configure Poetry to use the active interpreter
        run: poetry config virtualenvs.prefer-active-python true

      - name: Install Dependencies
        run: make install-dev
      
      - name: Check Parity of Councils / input.json / Feature file
        env:
          repo: ${{ github.event.pull_request.head.repo.full_name || 'robbrad/UKBinCollectionData' }}
          branch: ${{ github.event.pull_request.head.ref || 'master' }}
        run: make parity-check repo="$repo" branch="$branch"

  integration-tests:
    name: Run Integration Tests
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
        poetry-version: [1.8.4]
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        options: --shm-size=2gb --name selenium --hostname selenium
        env:
          SE_NODE_MAX_SESSIONS: 4
          SE_NODE_OVERRIDE_MAX_SESSIONS: true
        ports:
          - 4444:4444
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==${{ matrix.poetry-version }}

      - name: Configure Poetry to use the active interpreter
        run: poetry config virtualenvs.prefer-active-python true

      - name: Install Dependencies
        run: make install-dev

      - name: Run Integration Tests
        env:
          HEADLESS: True
          COUNCIL_TESTS: "ArmaghBanbridgeCraigavonCouncil or AshfieldDistrictCouncil or AshfordBoroughCouncil or BarkingDagenham or BexleyCouncil or BostonBoroughCouncil or BrecklandCouncil or BrentCouncil or BromleyBoroughCouncil or BroxbourneCouncil or CastlepointDistrictCouncil or ChichesterDistrictCouncil or DacorumBoroughCouncil or DartfordBoroughCouncil or DumfriesandGallowayCouncil or EastDevonDC or EastHampshireDC or EastLindseyDistrictCouncil or EastRenfrewshireCouncil or EastStaffordshireBoroughCouncil or FyldeCouncil or GedlingBoroughCouncil or GreatYarmouthBoroughCouncil or HaltonBoroughCouncil or HarrogateBoroughCouncil or HerefordshireCouncil or HertsmereBoroughCouncil or HighPeakCouncil or Hillingdon or HorshamDistrictCouncil or InverclydeCouncil or IpswichBoroughCouncil or IsleOfWightCouncil or KingstonUponThamesCouncil or KnowsleyMBCouncil or LancasterCityCouncil or LondonBoroughHammersmithandFulham or LondonBoroughSutton or MertonCouncil or MidAndEastAntrimBoroughCouncil or MidSussexDistrictCouncil or NewForestCouncil or NorthEastDerbyshireDistrictCouncil or NorthKestevenDistrictCouncil or NorthSomersetCouncil or NorthTynesideCouncil or NorwichCityCouncil or OrkneyIslandsCouncil or PeterboroughCityCouncil or PortsmouthCityCouncil or PowysCouncil or PrestonCityCouncil or SevenoaksDistrictCouncil or SouthHamsDistrictCouncil or SouthHollandDistrictCouncil or SouthTynesideCouncil or SouthendOnSeaCityCouncil or StaffordshireMoorlandsDistrictCouncil or StocktonOnTeesCouncil or TamesideMBCouncil or TamworthBoroughCouncil or TonbridgeAndMallingBC or TorfaenCouncil or ValeofGlamorganCouncil or WalsallCouncil or WarringtonBoroughCouncil or WaverleyBoroughCouncil or WealdenDistrictCouncil or WestBerkshireCouncil or WestDevonBoroughCouncil or WokingBoroughCouncil"
          UKBCD_DIAG: "1"
          PYTEST_ADDOPTS: "--tb=line --show-capture=no"
        run: make matrix=${{ matrix.python-version }} councils="${{ env.COUNCIL_TESTS }}" integration-tests
        continue-on-error: true

      - name: Upload Integration Test Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          file: build/${{ matrix.python-version }}/integration-test-results/junit.xml
          flags: integrationtestspr
          name: integration-tests-pr
